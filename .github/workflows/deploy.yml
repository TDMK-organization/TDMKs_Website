name: CI/CD Docker Deploy

on:
  push:
    branches:
      - deploy  

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: gitzno/tdmks_website:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push 
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Đăng nhập Docker trên VPS (nếu cần image riêng tư)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # Kéo bản mới nhất về
            docker pull gitzno/tdmks_website:latest
            
            # Dừng và xóa container cũ để giải phóng cổng 3000
            docker stop my-app-container || true
            docker rm my-app-container || true
            
            # Chạy container mới
            docker run -d \
              --name my-app-container \
              -p 3000:3000 \
              -e NUXT_SESSION_PASSWORD="${{ secrets.NUXT_SESSION_PASSWORD }}" \
              --restart always \
              gitzno/tdmks_website:latest
            
            # Dọn dẹp các image cũ không dùng đến để tránh đầy ổ cứng VPS
            docker image prune -f